<!DOCTYPE html>
<html lang="en" style="background:#090b0a" data-input="mouse">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0a">
<meta name="robots" content="noindex">

<title>PlayStation</title>
<script src="jeux.js?v=20261121f"></script>
<script>
	// "…/PSX/?DRV" lance directement le jeu.
	if (PSX_idDansUrl()) location.replace("jeu.html?" + encodeURIComponent(PSX_idDansUrl()) + location.hash);
</script>
<link rel="stylesheet" href="playtab.css?v=20261121f">
<style>
	body { display: flex; flex-direction: column; position: relative;
		background: radial-gradient(60% 60% at 50% 45%, #10241a 0%, var(--bg) 70%); }
	body::after { content: ""; position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen;
		background: repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 1px, transparent 1px 1.4rem); }
	header { padding: calc(5rem + env(safe-area-inset-top)) calc(var(--pad-x) + env(safe-area-inset-right)) 0 calc(var(--pad-x) + env(safe-area-inset-left)); animation: rise .7s var(--ease) both; }
	header h1 { margin: .5rem 0 0; font: 900 4.2rem/1 var(--display); font-stretch: 125%; letter-spacing: -.02em; text-shadow: 0 .3em 1.5em rgba(0,0,0,.5); }
	header .small { margin-top: .6rem; }

	.rail { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; border-radius: 1.4rem; margin: 0 calc(var(--pad-x) - 1rem); }
	.piste { display: flex; gap: 2.4rem; padding: 0 1rem; transition: transform .45s var(--ease); align-items: center; }
	.carte { flex: none; width: 19rem; cursor: pointer; opacity: .5; transition: opacity var(--t), transform var(--t) var(--spring); transform-origin: 50% 50%; }
	.carte.actif { opacity: 1; transform: scale(1.12); }
	.rail.is-f .carte.actif .boitier-jeu { box-shadow: 0 0 0 .25rem var(--fg), 0 0 0 .55rem rgba(var(--acc-rgb), .35), 0 1.2rem 3rem rgba(0,0,0,.5); }

	.fiche { padding: 0 calc(var(--pad-x) + env(safe-area-inset-right)) calc(6rem + env(safe-area-inset-bottom)) calc(var(--pad-x) + env(safe-area-inset-left));
		display: flex; flex-direction: column; gap: 1.1rem; align-items: flex-start; min-height: 19rem; }
	.fiche h2 { margin: 0; font: 900 3.2rem/1.05 var(--display); font-stretch: 105%; letter-spacing: -.02em; text-wrap: balance; }
	.fiche .meta { font: 500 1.2rem var(--mono); color: var(--muted); }
	.fiche .etat { font-size: 1.15rem; color: var(--fg-2); min-height: 1.6rem; display: flex; align-items: center; gap: .7rem; }
	.vide { margin: auto; color: var(--muted); }

	/* Boîtier généré (format CD PS1) */
	.boitier-jeu { --couleur: #3b4cc0; position: relative; aspect-ratio: 1 / 1.03; width: 100%; border-radius: .6rem; overflow: hidden;
		background: linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,0) 40%), linear-gradient(200deg, var(--couleur), color-mix(in srgb, var(--couleur) 40%, #000));
		box-shadow: 0 .07rem 0 rgba(255,255,255,.25) inset, 0 1.2rem 3rem rgba(0,0,0,.55); padding-left: 13%; transition: box-shadow var(--t); }
	.boitier-jeu::before { content: "PS"; position: absolute; inset: 0 auto 0 0; width: 13%; background: #0d0e12; color: rgba(255,255,255,.75);
		writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; justify-content: flex-end; padding: 1rem 0; font: 800 .9rem var(--mono); letter-spacing: .3em; }
	.boitier-jeu img { position: absolute; inset: 0 0 0 13%; width: 87%; height: 100%; object-fit: cover; }
	.boitier-titre { position: absolute; left: 13%; right: 0; bottom: 0; padding: 0 9% 11%; font: 850 1.9rem/1.05 var(--display); font-stretch: 110%; text-shadow: 0 .2rem 1rem rgba(0,0,0,.35); text-wrap: balance; }
	.boitier-serial { position: absolute; top: 8%; right: 8%; font: 600 .8rem var(--mono); letter-spacing: .08em; color: rgba(255,255,255,.75); }

	.fiche .actions { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center; }
	#st-liste .vide { color: var(--muted); padding: .5rem 1.2rem; }
	@media (max-height: 560px) { header { padding-top: calc(2rem + env(safe-area-inset-top)); } .fiche { padding-bottom: calc(2rem + env(safe-area-inset-bottom)); min-height: 0; } }
</style>
</head>
<body>
	<header>
		<div class="eyebrow" data-t="platform">PlayStation</div>
		<h1 data-t="library">Library</h1>
		<div class="small num" id="nb"></div>
	</header>

	<div class="rail f" id="rail" tabindex="-1" role="listbox" data-t-aria="library"><div class="piste" id="piste"></div></div>

	<section class="fiche" aria-live="polite">
		<h2 id="titre"></h2>
		<div class="meta" id="meta"></div>
		<div class="etat" id="etat"></div>
		<div class="actions">
			<a class="btn is-primary is-xl f" id="jouer" href="#" tabindex="-1" data-t="play">Play</a>
			<button class="btn f" id="stockage" type="button" tabindex="-1" data-t="storage">Storage</button>
		</div>
	</section>

	<!-- Games kept in this browser (streamed disc chunks, flux.js); saves are never touched -->
	<div class="modal-wrap" id="st" hidden>
		<div class="modal" role="dialog" aria-labelledby="st-titre">
			<div><div class="eyebrow" data-t="platform"></div><h2 id="st-titre" data-t="storageTitle"></h2></div>
			<div class="scroll" id="st-liste"></div>
			<div class="info" id="st-info"></div>
		</div>
	</div>

	<script src="textes.js?v=20261121f"></script>
	<script src="playtab.js?v=20261121f"></script>
	<script src="disques.js?v=20261121f"></script>
	<script src="flux.js?v=20261121f"></script>
	<script>
	(function () {
		var jeux = PSX_JEUX.slice(), $ = function (i) { return document.getElementById(i); };
		var piste = $("piste"), cartes = [], index = 0;

		function compte() { $("nb").textContent = jeux.length === 1 ? PT.t("gameCount") : PT.t("gamesCount", { n: jeux.length }); }
		compte(); PT.surLangue(compte);
		if (!jeux.length) { $("rail").outerHTML = '<p class="vide" data-t="noGames"></p>'; document.querySelector(".fiche").hidden = true; PT.traduire(); return; }

		function url(j) { return "jeu.html?" + j.id; }
		function jouer() { location.href = url(jeux[index]); }

		jeux.forEach(function (j, i) {
			var c = document.createElement("div");
			c.className = "carte"; c.setAttribute("role", "option"); c.setAttribute("aria-label", j.titre);
			c.appendChild(PSX_boitier(j));
			c.addEventListener("click", function () { PT.focaliser($("rail")); if (i === index) jouer(); else choisir(i); });
			piste.appendChild(c); cartes.push(c);
		});

		try { var d = sessionStorage.getItem("psx-dernier"); if (d) index = Math.max(0, jeux.findIndex(function (j) { return j.id === d; })); } catch (e) {}

		// ---- Discs streamed from the repo: what each game keeps in this browser (Cache Storage, flux.js) ----
		function dossiersDe(j) { return j.disques || (j.disque ? [j.disque] : []); }
		var reservesJeu = {};
		function reserves(j) {
			return reservesJeu[j.id] || (reservesJeu[j.id] = Promise.all(dossiersDe(j).map(function (d) {
				var a = new URL(d, PSX_DEPOT).href;
				return fetch(a + "disc.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (m) { return { nom: PSX_nomReserve(a, m.size), size: m.size }; });
			})).catch(function () { delete reservesJeu[j.id]; return []; }));
		}
		async function place(j) {
			if (!self.caches) return 0;
			var o = 0, l = await reserves(j);
			for (var i = 0; i < l.length; i++) {
				if (!(await caches.has(l[i].nom))) continue;
				o += Math.min((await (await caches.open(l[i].nom)).keys()).length * PSX_FLUX_CHUNK, l[i].size);
			}
			return o;
		}
		function mo(o) { return PT.nombre(o / 1048576, 0); }
		function liberer(j) { return reserves(j).then(function (l) { return Promise.all(l.map(function (r) { return caches.delete(r.nom); })); }); }

		function etat() {
			var j = jeux[index];
			if (dossiersDe(j).length) {
				place(j).then(function (o) {
					if (jeux[index] !== j) return;
					$("etat").innerHTML = o ? '<span class="pill"></span>' : '<span></span>';
					$("etat").firstChild.textContent = o ? PT.t("inBrowser", { size: mo(o) }) : PT.t("streamed");
				}, function () {});
				return;
			}
			PSX_lireDisque(j.id).then(function (f) {
				if (jeux[index] !== j) return;
				$("etat").innerHTML = f ? '<span class="pill" data-t="discSaved"></span>' : '<span data-t="discNeeded"></span>';
				PT.traduire($("etat"));
			}, function () {});
		}
		function choisir(i) {
			index = Math.max(0, Math.min(jeux.length - 1, i));
			var j = jeux[index];
			cartes.forEach(function (c, k) { c.classList.toggle("actif", k === index); c.setAttribute("aria-selected", k === index); });
			var rail = $("rail").getBoundingClientRect(), c = cartes[index];
			var centre = c.offsetLeft + c.offsetWidth / 2;
			piste.style.transform = "translateX(" + (rail.width / 2 - centre) + "px)";
			$("titre").textContent = j.titre;
			$("meta").textContent = [j.annee, j.editeur, j.genre].filter(Boolean).join(" · ");
			$("jouer").href = url(j);
			etat();
			try { sessionStorage.setItem("psx-dernier", j.id); } catch (e) {}
		}
		PT.surLangue(etat);

		$("jouer").addEventListener("click", function (e) { e.preventDefault(); jouer(); });

		var principal = {
			racine: document.body,
			depart: $("rail"),
			aide: ["change", "select"],
			horizontal: function (dir, el) {
				if (el !== $("rail")) return false;
				var avant = index; choisir(index + dir);
				if (avant === index) { var c = cartes[index]; c.style.setProperty("--bump", ".5rem"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
				return true;
			},
			start: jouer
		};
		PT.ecran(principal);

		// ---- Storage screen ----
		var garde = false;
		async function ouvrirStockage(depart) {
			var l = $("st-liste"), total = 0, lignes = [];
			for (var i = 0; i < jeux.length; i++) {
				var j = jeux[i];
				if (!dossiersDe(j).length) continue;
				var o = await place(j);
				if (o) { total += o; lignes.push([j, o]); }
			}
			try { garde = await navigator.storage.persisted(); } catch (e) {}
			l.innerHTML = "";
			if (!lignes.length) { var p = document.createElement("p"); p.className = "vide"; p.textContent = PT.t("storageEmpty"); l.appendChild(p); }
			lignes.forEach(function (x) {
				l.appendChild(PT.ligne(function () { return x[0].titre + " · " + PT.t("freeGame"); }, function () {
					liberer(x[0]).then(function () { PT.toast(PT.t("freed", { game: x[0].titre })); etat(); ouvrirStockage(); });
				}, function () { return mo(x[1]) + (PT.lang === "fr" ? " Mo" : " MB"); }));
			});
			if (lignes.length > 1) l.appendChild(PT.ligne("freeAll", function () {
				Promise.all(lignes.map(function (x) { return liberer(x[0]); })).then(function () { etat(); ouvrirStockage(); });
			}));
			if (navigator.storage && navigator.storage.persist) l.appendChild(PT.interrupteur({ t: "keepGames", get: function () { return garde; },
				set: function (v) { if (!v || garde) return; navigator.storage.persist().then(function (ok) { garde = ok; if (!ok) PT.toast(PT.t("keepRefused")); ouvrirStockage(); }); } }));
			var b = document.createElement("button"); b.className = "btn is-wide f"; b.tabIndex = -1; b.textContent = PT.t("back"); b.addEventListener("click", fermerStockage);
			l.appendChild(b);
			var est = {}; try { est = await navigator.storage.estimate(); } catch (e) {}
			$("st-info").textContent = PT.t("storageUsed", { size: mo(total), free: PT.nombre(Math.max(0, (est.quota || 0) - (est.usage || 0)) / 1073741824, 1) });
			$("st").hidden = false;
			PT.ecran({ racine: $("st"), aide: ["back", "select"], retour: fermerStockage, depart: depart || l.querySelector(".f") });
		}
		function fermerStockage() { $("st").hidden = true; principal.depart = $("stockage"); PT.ecran(principal); principal.depart = $("rail"); }
		$("stockage").addEventListener("click", function () { ouvrirStockage(); });
		// A sur le rail = jouer
		$("rail").addEventListener("click", function (e) { if (e.target === $("rail") || e.target === piste) jouer(); });

		var x0 = null;
		$("rail").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
		$("rail").addEventListener("touchend", function (e) {
			if (x0 === null) return;
			var dx = e.changedTouches[0].clientX - x0; x0 = null;
			if (Math.abs(dx) > 40) choisir(index + (dx < 0 ? 1 : -1));
		});
		addEventListener("resize", function () { choisir(index); });
		choisir(index);
	})();
	</script>
</body>
</html>
