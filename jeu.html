<!DOCTYPE html>
<html lang="en" style="background:#090b0a" data-input="mouse">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0a">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>PlayStation</title>
<link rel="stylesheet" href="playtab.css?v=20261121f">
<style>
	#stage { position: fixed; inset: 0; background: #000; }
	#game { position: absolute; inset: 0; }

	/* Interface EmulatorJS masquée : tout passe par le menu Pause PlayTab */
	.ejs_menu_bar, .ejs_context_menu, .ejs_settings_parent, .ejs_popup_container, .ejs_loading_text, .ejs_message,
	.ejs_start_button, .ejs_game_background, .ejs_cheat_parent, .ejs_volume_parent, .ejs_virtualGamepad_open { display: none !important; }

	/* Écran titre */
	#overlay { position: fixed; inset: 0; z-index: 6; display: flex; align-items: center;
		padding: calc(5rem + env(safe-area-inset-top)) calc(var(--pad-x) + env(safe-area-inset-right)) calc(5rem + env(safe-area-inset-bottom)) calc(var(--pad-x) + env(safe-area-inset-left));
		background: radial-gradient(60% 60% at 50% 45%, #10241a 0%, var(--bg) 70%); transition: opacity .4s var(--ease); }
	#overlay::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
		background: repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 1px, transparent 1px 1.4rem); }
	#overlay.parti { opacity: 0; pointer-events: none; }
	#panel { position: relative; z-index: 1; width: min(44rem, 100%); display: flex; flex-direction: column; gap: 1.6rem; animation: rise .7s var(--ease) both; }
	#panel h1 { margin: 0; font: 900 4.2rem/1 var(--display); font-stretch: 125%; letter-spacing: -.02em; text-wrap: balance; text-shadow: 0 .3em 1.5em rgba(0,0,0,.5); }
	#panel h1.long { font-size: 3.2rem; font-stretch: 105%; }
	#charge { display: flex; flex-direction: column; gap: .7rem; }
	#charge .txt { font: 1.35rem var(--mono); color: var(--fg-2); }
	#aide-erreur { font-size: 1.2rem; color: var(--danger); }
	#panel .rows { display: flex; flex-direction: column; gap: .7rem; }
	#panel .actions { display: flex; }

	/* Fenêtre de démarrage */
	#boot { z-index: 5; background: rgba(3,5,4,.55); transition: opacity .4s var(--ease); }
	#boot.parti { opacity: 0; pointer-events: none; }
	.etape { display: grid; grid-template-columns: 1.4rem 1fr; gap: .4rem 1.1rem; align-items: start; color: var(--dim); }
	.etape .rond { width: 1.4rem; height: 1.4rem; margin-top: .2rem; border-radius: 50%; border: .2rem solid var(--line-2); }
	.etape.encours { color: var(--fg); } .etape.encours .rond { border-top-color: var(--accent); animation: spin .9s linear infinite; }
	.etape.fini { color: var(--fg-2); } .etape.fini .rond { background: var(--accent); border-color: var(--accent); }
	.etape .det { grid-column: 2; font-size: 1.1rem; color: var(--muted); }
	.etape .bar { grid-column: 2; }

	/* En jeu */
	#menu-button { position: fixed; z-index: 4; top: calc(1.2rem + env(safe-area-inset-top)); left: calc(1.2rem + env(safe-area-inset-left)); font-size: 1.8rem; transition: opacity .4s; }
	#menu-button.cache, html[data-input="pad"] #menu-button, html[data-input="key"] #menu-button { opacity: 0; pointer-events: none; }
	#stats { position: fixed; z-index: 3; left: calc(1.2rem + env(safe-area-inset-left)); bottom: calc(1rem + env(safe-area-inset-bottom));
		padding: .4rem .8rem; border-radius: .5rem; background: rgba(9,11,10,.72); font: .95rem var(--mono); color: var(--fg-2); white-space: pre-wrap; pointer-events: none; }

	#menu .modal, #controles .modal { width: min(56rem, 94vw); }
	#controles .row .side { min-width: 16rem; text-align: right; }
	#controles .row.attente .side { color: var(--accent); }
	#capture-aide { font-size: 1.2rem; color: var(--fg-2); min-height: 1.8rem; }
	input[type=file] { display: none; }
</style>
</head>
<body>
	<div id="stage"><div id="game"></div></div>

	<!-- Écran titre -->
	<div id="overlay">
		<div id="panel">
			<div class="eyebrow" data-t="platform">PlayStation</div>
			<h1 id="titre">&nbsp;</h1>
			<div id="charge">
				<div class="txt" id="charge-txt" data-t="preparing"></div>
				<div class="bar busy" id="charge-bar"><i></i></div>
				<div class="small" data-t="reassure"></div>
			</div>
			<div id="aide-erreur" hidden></div>
			<div class="small" id="disque-aide" data-t="discHelp" hidden></div>
			<div class="rows" id="rows-titre"></div>
			<div class="actions"><button class="btn is-primary is-xl f" id="jouer" tabindex="-1" disabled data-t="loading">Loading…</button></div>
		</div>
	</div>

	<!-- Fenêtre de démarrage -->
	<div class="modal-wrap" id="boot" hidden>
		<div class="modal" role="dialog" aria-labelledby="boot-titre">
			<h2 id="boot-titre" data-t="bootTitle"></h2>
			<div class="etape" id="e1"><span class="rond"></span><span data-t="boot1"></span><span class="det" id="e1d"></span></div>
			<div class="etape" id="e2"><span class="rond"></span><span data-t="boot2"></span><span class="det" id="e2d"></span><div class="bar busy" id="e2b" hidden><i></i></div></div>
			<div class="etape" id="e3"><span class="rond"></span><span data-t="boot3"></span><span class="det" id="e3d"></span></div>
			<div class="small" data-t="bootNote"></div>
		</div>
	</div>

	<button class="btn is-icon cache" id="menu-button" data-t-aria="paused" hidden>☰</button>
	<div id="stats" class="num" hidden></div>

	<!-- Menu Pause -->
	<div class="modal-wrap" id="menu" hidden>
		<div class="modal" role="dialog" aria-labelledby="menu-titre">
			<div><div class="eyebrow" id="menu-jeu"></div><h2 id="menu-titre" data-t="paused"></h2></div>
			<div class="scroll" id="menu-liste"></div>
			<div class="info" id="menu-info"></div>
		</div>
	</div>

	<!-- Personnalisation des commandes -->
	<div class="modal-wrap" id="controles" hidden>
		<div class="modal" role="dialog" aria-labelledby="ctrl-titre">
			<div><div class="eyebrow" id="ctrl-jeu"></div><h2 id="ctrl-titre" data-t="controlsTitle"></h2></div>
			<div id="capture-aide"></div>
			<div class="scroll" id="ctrl-liste"></div>
		</div>
	</div>

	<!-- Le jeu s'est arrêté -->
	<div class="modal-wrap" id="halt" hidden>
		<div class="modal" role="alertdialog" aria-labelledby="halt-titre">
			<h2 id="halt-titre" data-t="halted"></h2>
			<p data-t="haltHelp"></p>
			<div class="small num" id="halt-raison"></div>
			<div><button class="btn is-primary f" id="recharger" tabindex="-1" data-t="reload"></button></div>
		</div>
	</div>

	<input type="file" id="f-disque" accept=".bin,.img,.iso">
	<input type="file" id="f-etat" accept=".state">
	<input type="file" id="f-carte" accept=".srm,.mcr,.mcd,.mc,.bin">

	<script src="jeux.js?v=20261121f"></script>
	<script src="textes.js?v=20261121f"></script>
	<script src="playtab.js?v=20261121f"></script>
	<script src="disques.js?v=20261121f"></script>
	<script src="flux.js?v=20261121f"></script>
	<script src="lecteur.js?v=20261121f"></script>
</body>
</html>
